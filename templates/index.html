<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: green;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>House Price Prediction</h2>

    <form action="/predict" method="POST">

        <label>Area</label>
        <input type="number" name="area" required>

        <label>Bedrooms</label>
        <input type="number" name="bedrooms" required>

        <label>Bathrooms</label>
        <input type="number" name="bathrooms" required>

        <label>Stories</label>
        <input type="number" name="stories" required>

        <label>Parking</label>
        <input type="number" name="parking" required>

        <label>Main Road</label>
        <select name="mainroad" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Guest Room</label>
        <select name="guestroom" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Basement</label>
        <select name="basement" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Hot Water Heating</label>
        <select name="hotwaterheating" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Air Conditioning</label>
        <select name="airconditioning" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Preferred Area</label>
        <select name="prefarea" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Furnishing Status</label>
        <select name="furnishingstatus" required>
            <option value="0">Unfurnished</option>
            <option value="1">Semi-Furnished</option>
            <option value="2">Furnished</option>
        </select>

        <button type="submit">Predict Price</button>

    </form>

    {% if prediction %}
        <div class="result">
            Predicted House Price: ₹ {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
